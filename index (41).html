<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 1 Class Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a one-screen class console. Agenda rail on top, reading pane and controls left, live 3D chart right, navigation on the bottom. Colors borrow from an aeronautical chart: pale paper, chart blue, magenta. */
:root{
  --paper:#EDF1F3; --panel:#FFFFFF; --wash:#DDE6EC; --ink:#13283B; --muted:#55687A; --line:#C5D0D9;
  --blue:#1C5FA5; --mag:#B0126B; --ok:#1E7A4F; --no:#B3261E; --on:#FFFFFF;
  --t0:#2F7FD0; --t1:#D98A00; --t2:#2FA36B; --t3:#E0542B; --t4:#C2338B; --t5:#8266D9;
  --ball-hi:#FFB08F; --ball-lo:#A53A1A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D1822; --panel:#152433; --wash:#1B2E40; --ink:#E6EEF4; --muted:#9DB0C0; --line:#2C4054;
  --blue:#74B4F2; --mag:#F272B6; --ok:#5FD39A; --no:#FF8A80; --on:#0D1822; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0D1822; --panel:#152433; --wash:#1B2E40; --ink:#E6EEF4; --muted:#9DB0C0; --line:#2C4054;
  --blue:#74B4F2; --mag:#F272B6; --ok:#5FD39A; --no:#FF8A80; --on:#0D1822; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:clamp(16px,1.15vw,21px);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

.rail{display:flex;gap:4px;padding:10px 16px 8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.seg{flex:1 1 auto;text-align:left;background:transparent;border:0;border-top:4px solid var(--line);padding:6px 14px 2px 0;cursor:pointer}
.seg b{display:block;font-family:var(--display);font-weight:600;font-size:1.05em;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.seg span{font-family:var(--mono);font-size:.68em;color:var(--muted);white-space:nowrap}
.seg.past{border-top-color:var(--blue)}
.seg.on{border-top-color:var(--mag)}
.seg.on b{color:var(--mag)}

.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:0}
.text{min-width:0;overflow-y:auto;padding:clamp(18px,2.2vw,36px) clamp(16px,2.6vw,44px)}
.view{min-width:0;position:relative;overflow:hidden;background-color:var(--wash);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;border-left:1px solid var(--line)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.view canvas:active{cursor:grabbing}
.cap{position:absolute;left:14px;right:14px;bottom:12px;margin:0;font-family:var(--mono);font-size:.7em;color:var(--muted);pointer-events:none}
.hint{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:.66em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:3px 8px;border-radius:999px;pointer-events:none;transition:opacity .4s}
.hint.off{opacity:0}
.nogl .view,.noview .view{display:none}
.nogl .stage,.noview .stage{grid-template-columns:minmax(0,1fr)}
.noview .text{padding-inline:clamp(16px,7vw,150px)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:4px 56px;align-items:start}
.cols>div{min-width:0}
/* teaching blocks: a definition, an instruction, a question for the room */
.def,.do,.ask{margin:0 0 14px;padding-top:8px;border-top:2px solid var(--ink);max-width:66ch}
.def>b,.do>b,.ask>b{display:block;font-family:var(--mono);font-weight:500;font-size:.7em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.def>b{color:var(--blue)}
.ask{border-top-color:var(--mag)}
.ask>b{color:var(--mag)}
.ask p{font-size:1.16em;font-weight:500;line-height:1.35}
.ask p.bigq{font-size:clamp(26px,2.9vw,50px);font-weight:600;line-height:1.14;max-width:22ch;text-wrap:balance}
.def p,.do ol,.ask p{margin-bottom:6px}
.do li{margin-bottom:3px}

.kicker{margin:0 0 6px;font-family:var(--mono);font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--mag)}
h1{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:clamp(32px,3.9vw,70px);line-height:.98;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
h2{margin:20px 0 8px;font-family:var(--display);font-weight:600;font-size:1.5em;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
p{margin:0 0 12px;max-width:62ch}
.lede{font-size:1.22em;line-height:1.35;font-weight:500}
ul,ol{margin:0 0 12px;padding-left:1.2em;max-width:62ch}
li{margin-bottom:6px}
.muted{color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,5.2vw,92px);line-height:1;text-transform:uppercase}
.clock{font-family:var(--mono);font-size:clamp(36px,4.4vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.clock.over{color:var(--no)}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.btn,.chip{border:2px solid var(--ink);background:transparent;padding:.42em .9em;cursor:pointer;font-weight:600;border-radius:2px;text-decoration:none;display:inline-block}
.btn.go{background:var(--mag);border-color:var(--mag);color:var(--on)}
.btn:disabled{opacity:.4;cursor:default}
.chip{border-color:var(--line);font-weight:500;padding:.3em .75em;border-radius:999px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.ok{border-color:var(--ok);background:transparent;color:var(--ok)}
.chip.ok::before{content:"\2713\00a0"}
.chip.no{border-color:var(--no);background:transparent;color:var(--no);text-decoration:line-through}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.45em;vertical-align:baseline}
.lnk{background:none;border:0;padding:0;font-weight:600;color:var(--blue);text-decoration:underline;cursor:pointer;text-align:left}

.panel{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin:0 0 12px;max-width:66ch}
.panel p:last-child,.panel ul:last-child{margin-bottom:0}
.panel dt{font-family:var(--mono);font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.panel dt:first-child{margin-top:0}
.panel dd{margin:2px 0 0}

/* the hands-on strip: one control, one live readout */
.ctl{border:2px solid var(--mag);padding:12px 16px;margin:0 0 12px;max-width:66ch}
.ctl label{margin-top:0}
.ctl .row{margin:6px 0 0}
.read{margin:8px 0 0;font-family:var(--mono);font-size:.86em;font-variant-numeric:tabular-nums;max-width:none}
.read b{color:var(--mag);font-weight:500}
.ctl .say{margin:8px 0 0}

.q{border-top:1px solid var(--line);padding:12px 0 4px;max-width:70ch}
.qs{margin:0 0 8px;font-weight:500}
.qn{font-family:var(--mono);color:var(--mag);margin-right:.6em}
.qa{margin:8px 0 6px;padding-left:12px;border-left:3px solid var(--blue)}
.q .chips{display:flex;flex-wrap:wrap;gap:6px}

details.box{border:1px solid var(--line);background:var(--panel);margin:0 0 8px;max-width:66ch}
details.box summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.box summary span{font-weight:400;color:var(--muted)}
details.box p{padding:0 14px 12px;margin:0}

.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink);background:var(--panel);margin:0 0 14px}
.sheet details{border:1px solid var(--line);padding:12px 14px;min-height:8.5em;min-width:0}
.sheet summary{cursor:pointer;list-style:none}
.sheet summary::-webkit-details-marker{display:none}
.sheet summary b{display:block;font-family:var(--display);font-weight:700;font-size:1.35em;text-transform:uppercase;letter-spacing:.02em}
.sheet summary span{display:block;color:var(--muted)}
.sheet summary i{display:block;font-style:normal;font-family:var(--mono);font-size:.66em;letter-spacing:.1em;text-transform:uppercase;color:var(--mag);margin-top:6px}
.sheet details[open] summary i{display:none}
.sheet details p{margin:8px 0 0;padding-top:8px;border-top:2px solid var(--mag);font-weight:500}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:.9em}
th{font-family:var(--mono);font-size:.74em;letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--muted);padding:6px 10px 6px 0;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
tr.hl td{font-weight:600}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--mag);padding-left:10px}

.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 12px;max-width:70ch}
.duo .panel{margin:0}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;padding:8px 0 8px 2.6em;border-top:1px solid var(--line);position:relative;margin:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;font-family:var(--display);font-weight:700;font-size:1.6em;color:var(--mag)}

label{display:block;font-family:var(--mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=url],input[type=time],input[type=number],select,textarea{width:100%;max-width:44ch;background:var(--panel);border:1px solid var(--line);padding:.4em .6em;border-radius:2px}
input[type=range]{display:block;width:100%;max-width:46ch;accent-color:var(--mag);margin:2px 0}
textarea{min-height:7em;resize:vertical}
.tag-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,12em);gap:10px;align-items:center;border-top:1px solid var(--line);padding:6px 0;max-width:66ch}
.tag-row select{max-width:none}
.tag-row small{display:block;color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-family:var(--mono);font-size:.78em}
.calc{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;max-width:60ch;margin:0 0 12px}

.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
body:not(.inst) .inst{display:none!important}
body.inst .stu{display:none!important}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav .count{font-family:var(--mono);font-size:.8em;font-variant-numeric:tabular-nums}
.nav .now{margin-left:auto;font-family:var(--mono);font-size:.8em;color:var(--muted);text-align:right}

.flyball{position:fixed;left:0;top:0;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--ball-hi),var(--t3) 58%,var(--ball-lo));pointer-events:none;z-index:50;will-change:transform}

@media (max-width:820px){
  .sheet{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
  .stage{display:block;overflow-y:auto}
  .view{height:36vh;min-height:210px;border-left:0;border-bottom:1px solid var(--line)}
  .text{overflow:visible}
  .tag-row{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Tonight's agenda"></nav>
  <div class="stage">
    <main class="text" id="text" tabindex="-1"></main>
    <aside class="view" id="view"><div id="gl"></div><span class="hint" id="hint">Drag to turn</span><p class="cap" id="cap"></p></aside>
  </div>
  <div class="nav">
    <button class="btn" id="prev" type="button">Back</button>
    <button class="btn go" id="next" type="button">Next</button>
    <span class="count" id="count"></span>
    <button class="btn" id="instBtn" type="button" aria-pressed="false">Instructor view</button>
    <span class="now" id="now"></span>
  </div>
</div>

<!-- ===================== SCREENS ===================== -->
<template id="s-welcome" data-seg="welcome" data-view="off">
  <p class="kicker">Week 1 · Tuesday, October 20</p>
  <h1>Matching AI to the problem</h1>
  <p class="lede">Most failed AI projects do not fail because the technology is weak. They fail because someone picked the tool before naming the problem.</p>
  <div class="cols">
    <div>
      <h2>Tonight</h2>
      <div class="tw"><table id="agenda"></table></div>
      <details class="box inst"><summary>Class setup <span>(instructor)</span></summary>
        <p><label for="setStart">Class starts at</label><input type="time" id="setStart">
        <label for="setIntro">Minutes for the Loop</label><select id="setIntro"><option>30</option><option>35</option><option>40</option><option>45</option></select>
        <label for="setLink">Escape room link (https)</label><input type="url" id="setLink" placeholder="https://"></p>
        <p class="muted">The lecture takes whatever the Loop does not use. Settings stay on this device only.</p>
      </details>
    </div>
    <div>
      <h2>By 9:00 you can</h2>
      <ol>
        <li>Identify the common problem types AI addresses.</li>
        <li>Match an AI technology to the problem in front of you.</li>
        <li>Recognize what a successful AI application looks like in different industries.</li>
      </ol>
  <div class="ask"><b>Warm-up</b><p>Name one AI system you used today. What task was it doing for you?</p></div>
    </div>
  </div>
</template>

<template id="s-loop" data-seg="loop" data-cap="One seat for each student in the class.">
  <p class="kicker">The Loop · <span data-time="loop.start"></span> to <span data-time="loop.end"></span></p>
  <h1>Around the Loop</h1>
  <p class="lede">You know each other already. So skip the biography. Tell the class about the AI in your Discussion 0 article.</p>
  <div class="do"><b>Do this</b><ol><li>Type the AI system from your article in the box below. Use one sentence.</li><li>When your name is called, answer the four questions.</li><li>Stop when your time is up.</li><li>While others speak, write down one system you had not thought of as AI.</li></ol></div>
  <label for="mySys">The AI system in my article, in one sentence</label>
  <input type="text" id="mySys" data-save="sys" maxlength="160" autocomplete="off">
  <h2>The four questions</h2>
  <ol>
    <li><strong>Your name and what you do or study.</strong></li>
    <li><strong>The AI system in your article.</strong> One sentence: what does it do?</li>
    <li><strong>One claim you checked.</strong> True, sensationalized, or false?</li>
    <li><strong>Would you trust that system with a decision about you?</strong> Yes or no, and why.</li>
  </ol>
  <div class="ask"><b>After the Loop</b><p>Which system surprised you? Why had you not thought of it as AI?</p></div>
  <div class="inst">
    <h2>Instructor controls</h2>
    <div class="panel" aria-live="polite">
      <p class="kicker" id="loopPos"></p>
      <p class="big" id="loopName"></p>
      <p class="clock" id="loopClock"></p>
    </div>
    <div class="row">
      <button class="btn go" id="loopNext" type="button"></button>
      <button class="btn" id="loopRand" type="button">Pick at random</button>
      <button class="btn" id="loopPause" type="button">Pause</button>
    </div>
    <p class="muted">Click a seat on the ring to choose that student.</p>
    <label for="loopNote">The AI system this speaker described</label>
    <input type="text" id="loopNote" maxlength="80" autocomplete="off">
    <details class="box" style="margin-top:14px"><summary>Set up the Loop</summary>
      <p><label for="loopRoster">First names, one per line</label><textarea id="loopRoster" placeholder="Leave empty to use the class list"></textarea>
      <label for="loopCount">Number of seats when no names are entered</label><input type="number" id="loopCount" min="2" max="40"></p>
      <p><button class="btn" id="loopShuffle" type="button">Shuffle the seats</button> <button class="btn" id="loopReset" type="button">Start the Loop over</button></p>
      <p class="muted" id="loopPer"></p>
    </details>
  </div>
</template>

<template id="s-hook" data-seg="lecture" data-view="off">
  <p class="kicker">Lecture · <span data-time="lecture.start"></span> to <span data-time="lecture.end"></span></p>
  <h1>Discuss first</h1>
  <div class="do"><b>Do this</b><ol><li>Read both questions.</li><li>Talk with the person next to you for two minutes.</li><li>Be ready to share your answer with the class.</li></ol></div>
  <div class="cols">
    <div class="ask"><b>Question 1</b><p class="bigq">What happens when a manager buys the latest AI tool before identifying a need?</p></div>
    <div class="ask"><b>Question 2</b><p class="bigq">Have you ever bought an AI tool, or any piece of technology, and then not known what you were going to use it for?</p></div>
  </div>
</template>

<template id="s-order" data-seg="lecture" data-view="off">
  <p class="kicker">Lecture · The method</p>
  <h1>The order that works</h1>
  <p class="lede">Teams that buy the tool first spend the project looking for a problem it fits. Work in this order instead.</p>
  <div class="cols">
    <div>
      <ol class="steps">
        <li><strong>Name the problem type.</strong> What kind of task is the system doing?</li>
        <li><strong>Plan with a framework.</strong> Should AI make this decision, and how do we run the project?</li>
        <li><strong>Match the technology.</strong> Let the data and the limits choose the tool.</li>
        <li><strong>Judge success by the industry.</strong> A hospital and a clothing store do not mean the same thing by "it works."</li>
      </ol>
      <p class="muted">Every weekly project and your capstone use these four steps.</p>
    </div>
    <div>
  <div class="def"><b>Definition</b><p><strong>Problem type.</strong> The kind of task an AI system performs, such as sorting items or predicting a number.</p><p><strong>Framework.</strong> A checklist for the whole project. It forces the hard questions before anyone builds.</p><p><strong>Technology.</strong> The method that performs the task, such as traditional machine learning or deep learning.</p></div>
  
    </div>
  </div>
</template>

<template id="s-types" data-seg="lecture" data-cap="">
  <p class="kicker">Step 1 · Name the problem type</p>
  <h1>Six problem types AI solves</h1>
  <div class="def"><b>Definition</b><p><strong>Problem type.</strong> The kind of task an AI system performs. Almost every AI system performs one of the six tasks in the table below.</p></div>
  <div class="tw"><table id="typeTable"></table></div>
  <div class="do"><b>Do this</b><ol><li>Select a problem type in the table.</li><li>Read the three lines under the table: what the dots are, the example, and the data it needs.</li><li>Use the control in the outlined box. Watch the chart change.</li><li>Type your answer to the question in the outlined box.</li><li>Repeat for all six problem types.</li></ol></div>
  <dl class="panel" id="typePanel"></dl>
  <div class="ctl" id="typeCtl"></div>
  <div class="def"><b>Definition</b><p><strong>Vector.</strong> A list of numbers that describes one item. The numbers give the item its position on the chart. Similar items sit close together.</p><p><strong>Model.</strong> The trained system that turns a new item into an answer.</p></div>
  <div class="ask"><b>Discuss after all six</b><p>Pick a problem from your work or daily life. Which of the six problem types is it, and what data would the system need?</p></div>
</template>

<template id="s-name" data-seg="lecture" data-cap="The chart shows the problem type once you find it.">
  <p class="kicker">Step 1 · Your turn</p>
  <h1>Name the problem type</h1>
  <div class="do"><b>Do this</b><ol><li>Read each system.</li><li>Select the problem type it is.</li><li>Read the explanation. If your answer is marked wrong, try again.</li></ol></div>
  <div id="nameQuiz"></div>
  <div class="ask"><b>Discuss</b><p>Which system was hardest to name? What made it hard?</p></div>
</template>

<template id="s-room" data-seg="lecture" data-cap="">
  <p class="kicker">Step 1 · From the Loop</p>
  <h1>Which problem type is your system?</h1>
  <p>During the Loop you described the AI system from your article. Now name its problem type.</p>
  <div class="do"><b>Do this</b><ol><li>Check the sentence that describes your system. Fix it if you need to.</li><li>Select the problem type it is.</li><li>Write one sentence that says why.</li><li>Be ready to read your answer when your name is called.</li></ol></div>
  <label for="roomSys">The AI system in my article, in one sentence</label>
  <input type="text" id="roomSys" data-save="sys" maxlength="160" autocomplete="off">
  <label>Its problem type</label>
  <div class="row" id="roomChips"></div>
  <label for="roomWhy">Why it is that problem type</label>
  <textarea id="roomWhy" data-save="sysWhy" placeholder="Type one sentence"></textarea>
  <div class="ask" style="margin-top:14px"><b>Discuss</b><p>Which problem type did this class name most often? Which did nobody name, and why?</p></div>
  <details class="box inst"><summary>Class list <span>(instructor)</span></summary>
    <div style="padding:0 14px 12px"><div class="tally" id="roomTally"></div><div id="roomRows"></div></div>
  </details>
</template>

<template id="s-canvas" data-seg="lecture" data-view="off">
  <p class="kicker">Step 2 · Should AI make this decision?</p>
  <h1>The AI Canvas</h1>
  <div class="cols">
    <div>
      <div class="def"><b>Definition</b><p><strong>The AI Canvas.</strong> A one-page planning worksheet with seven boxes. A team fills it in before building anything. Each box asks one question about one decision.</p><p><strong>Where it comes from.</strong> Three economists at the University of Toronto, Ajay Agrawal, Joshua Gans, and Avi Goldfarb, published it in 2018. Their idea: AI makes predictions cheaper. So the worksheet starts with a prediction.</p></div>
    </div>
    <div>
      <div class="def"><b>Case study</b><p><strong>A base housing maintenance office gets 400 work orders a week.</strong> A gas smell sits in the same queue as a squeaky door. Leadership asks whether AI should decide which orders go first.</p></div>
      <div class="do"><b>Do this</b><ol><li>Read the question in each box.</li><li>Write your own answer for the housing office.</li><li>Click the box to compare your answer with the sample answer.</li></ol></div>
    </div>
  </div>
  <div class="sheet" aria-label="The AI Canvas worksheet">
    <details><summary><b>Prediction</b><span>What do we need to know that we do not know now?</span><i>Click to compare</i></summary><p>Which new work orders are urgent.</p></details>
    <details><summary><b>Judgment</b><span>What does each kind of mistake cost?</span><i>Click to compare</i></summary><p>Miss an urgent order and a family sits with a gas leak or no heat. Flag a routine order by mistake and a technician arrives early for a squeaky door. The first mistake costs far more. This is the box teams skip.</p></details>
    <details><summary><b>Action</b><span>What will we do with the prediction?</span><i>Click to compare</i></summary><p>Move flagged orders to the front of the queue. A dispatcher confirms before a crew is sent.</p></details>
    <details><summary><b>Outcome</b><span>How will we measure success?</span><i>Click to compare</i></summary><p>Hours from request to response on urgent orders, with no longer wait on routine ones.</p></details>
    <details><summary><b>Input</b><span>What data does each prediction use?</span><i>Click to compare</i></summary><p>The words in the request, the category, the building, and the time of day.</p></details>
    <details><summary><b>Training</b><span>What past data teaches the system?</span><i>Click to compare</i></summary><p>Three years of closed work orders, each marked with how urgent it turned out to be.</p></details>
    <details><summary><b>Feedback</b><span>How do results flow back?</span><i>Click to compare</i></summary><p>Every time the dispatcher changes a flag, that correction goes into the records.</p></details>
  </div>
  <div class="ask"><b>Discuss</b><p>Which box would your workplace skip? What would skipping it cost?</p></div>
</template>

<template id="s-judgment" data-seg="lecture" data-cap="Each dot is one work order. Blue is routine. Magenta is urgent. Everything right of the plane gets flagged. Amber is a mistake.">
  <p class="kicker">Step 2 · The box teams skip</p>
  <h1>Judgment: set the cutoff</h1>
  <p>The housing office trained its system. It gives every work order a score, from routine on the left to urgent on the right. Someone still has to decide how high a score must be before a crew is sent first.</p>
  <div class="def"><b>Definition</b><p><strong>Cutoff.</strong> The score at which the system acts. Orders above it get flagged as urgent.</p><p><strong>Miss.</strong> An urgent order the system let through as routine.</p><p><strong>False alarm.</strong> A routine order the system flagged as urgent.</p></div>
  <div class="ctl">
    <label for="cutoff">Where do you set the cutoff?</label>
    <input type="range" id="cutoff" min="-2.2" max="2.2" step="0.05" value="0">
    <p class="read" id="cutRead" aria-live="polite"></p>
    <p class="say">No cutoff gets both numbers to zero.</p>
  </div>
  <div class="do"><b>Do this</b><ol><li>Slide the cutoff left and right. Watch both numbers.</li><li>Stop at the lowest damage score.</li><li>Write down which mistake you chose to accept more of: misses or false alarms.</li></ol></div>
  <div class="ask"><b>Discuss</b><p>Who should set the cutoff: the vendor, the dispatcher, or the housing director? Why?</p></div>
</template>

<template id="s-crisp" data-seg="lecture" data-cap="Six phases on a ring. Click a phase. A failed evaluation sends the project back to the start.">
  <p class="kicker">Step 2 · How do we run the project?</p>
  <h1>CRISP-DM is a loop</h1>
  <div class="def"><b>Definition</b><p><strong>CRISP-DM.</strong> Short for Cross-Industry Standard Process for Data Mining. It is a list of six phases a team follows to run a data project. An industry group published it in the late 1990s. It is still the most widely used.</p><p><strong>Data mining.</strong> Finding useful patterns in large sets of data.</p></div>
  <div class="def"><b>Case study</b><p><strong>The housing office, continued.</strong> The AI Canvas said yes: let AI score work orders for urgency. Now the team has to run the project. Follow it through all six phases.</p></div>
  <div class="row" id="crispChips"></div>
  <div class="panel" id="crispPanel" aria-live="polite"></div>
  <div class="row"><button class="btn go" id="crispNext" type="button">Next phase</button><button class="btn" id="crispFail" type="button">Evaluation fails</button></div>
  <div class="do"><b>Do this</b><ol><li>Step through the six phases. Read what each one means and what the housing office did.</li><li>At phase 5, press Evaluation fails. Watch where the project goes.</li></ol></div>
  <p><strong>The two tools work together.</strong> The AI Canvas is the worksheet from two screens back. It answers whether to hand a decision to AI. CRISP-DM runs the project once the answer is yes. A team that skips the loop ships a system nobody uses.</p>
  <div class="ask"><b>Discuss</b><p>Which phase does a team under deadline pressure skip? What happens when it does?</p></div>
</template>

<template id="s-data" data-seg="lecture" data-cap="">
  <p class="kicker">Step 3 · Match the technology</p>
  <h1>The data decides</h1>
  <p>Start with one question. Is the data structured or unstructured?</p>
  <div class="row"><button class="chip" id="dStruct" type="button" aria-pressed="true">Structured</button><button class="chip" id="dUnstruct" type="button" aria-pressed="false">Unstructured</button></div>
  <div class="panel" id="dataPanel" aria-live="polite"></div>
  <div class="tw"><table>
    <tr><th>Technology</th><th>Best at</th><th>Example</th></tr>
    <tr><td>Traditional machine learning</td><td>Patterns in structured data, on modest computing power</td><td>Forecasting inventory, flagging card fraud</td></tr>
    <tr><td>Deep learning</td><td>Images, audio, and language</td><td>Reading medical scans, speech recognition</td></tr>
    <tr><td>Reinforcement learning</td><td>Learning by acting and getting feedback</td><td>Controlling robots, cutting cooling energy in data centers</td></tr>
    <tr><td>GenAI</td><td>Creating new text, images, audio, or code</td><td>Drafting reports, summarizing documents</td></tr>
  </table></div>
  <div class="do"><b>Do this</b><ol><li>Switch between Structured and Unstructured and compare the two charts.</li><li>For each item, decide whether it is structured or unstructured data: a sales spreadsheet, a voicemail, a temperature reading taken every minute, a photo of a rash, a text message.</li><li>Keep in mind why this matters: you have to know which kind of data you have before you can pick a technology.</li></ol></div>
  <p><strong>Do not reach for the most powerful tool by default.</strong> A store forecasting inventory from sales records does not need deep learning. A factory reading camera images does.</p>
  <div class="ask"><b>Discuss</b><p>Where you work, is most of the data structured or unstructured?</p></div>
</template>

<template id="s-deep" data-seg="lecture" data-cap="">
  <p class="kicker">Step 3 · Inside the technology</p>
  <h1>How deep is deep?</h1>
  <p>The four terms nest. Each one sits inside the one before it.</p>
  <ol>
    <li><strong>Artificial intelligence.</strong> Any system that does a task we associate with human thinking.</li>
    <li><strong>Machine learning.</strong> AI that learns its rules from data.</li>
    <li><strong>Neural networks.</strong> Machine learning built from layers of connected nodes.</li>
    <li><strong>Deep learning.</strong> A neural network with many layers.</li>
  </ol>
  <div class="do"><b>Do this</b><ol><li>Move the slider from 3 layers to 12.</li><li>Watch the line under the slider. It changes from "a standard neural network" to "deep learning." Note the number of layers where it changes.</li><li>Press Send a signal through. Count how many layers the signal passes.</li></ol></div>
  <div class="ctl">
    <label for="layers">Add layers</label>
    <input type="range" id="layers" min="3" max="12" step="1" value="3">
    <p class="read" id="layRead" aria-live="polite"></p>
    <div class="row"><button class="btn go" id="pulse" type="button">Send a signal through</button></div>
    <p class="say" id="laySay"></p>
  </div>
  <p><strong>The difference is depth: the number of layers.</strong> Nothing else separates the two.</p>
  <div class="ask"><b>Discuss</b><p>Deeper networks read harder data. So why not always use the deepest one?</p></div>
</template>

<template id="s-gen" data-seg="lecture" data-cap="">
  <p class="kicker">Step 3 · Inside the technology</p>
  <h1>How GenAI makes something new</h1>
  <p>GenAI is not one technology. Three model types do most of the work.</p>
  <div class="tw"><table>
    <tr><th>Model type</th><th>How it works</th><th>Makes</th></tr>
    <tr class="hl"><td>Diffusion model</td><td>Adds noise to data step by step, then learns to reverse the process</td><td>Images, video, audio</td></tr>
    <tr><td>Large language model</td><td>Predicts the next word, over and over</td><td>Text and code</td></tr>
    <tr><td>Generative adversarial network</td><td>Two networks compete. One makes fakes. One tries to catch them.</td><td>Images</td></tr>
  </table></div>
  <div class="def"><b>Definition</b><p><strong>Noise.</strong> Random static with no pattern in it.</p><p><strong>Diffusion.</strong> Learning to remove noise a little at a time until a picture is left.</p></div>
  <div class="ctl">
    <label for="noise">Noise</label>
    <input type="range" id="noise" min="0" max="100" step="1" value="0">
    <p class="read" id="noiseRead" aria-live="polite"></p>
    <div class="row"><button class="btn" id="genNoise" type="button">Add noise, step by step</button><button class="btn go" id="genBack" type="button">Reverse it</button></div>
    <p class="say">Drag to 100. Then press Reverse it more than once. You never get the same picture back.</p>
  </div>
  <div class="ask"><b>Discuss</b><p>You never get the same picture back. What does that tell you about asking GenAI for a fact?</p></div>
</template>

<template id="s-limits" data-seg="lecture" data-cap="Rows and columns on one side, raw material on the other. The limits decide the rest." data-view="off">
  <p class="kicker">Step 3 · Your turn</p>
  <h1>Four limits on the technology you can use</h1>
  <p>The best technology in theory is not always the one you can use. Four real-world limits can force a different choice.</p>
  <div class="tw"><table>
    <tr><th>Limit</th><th>What it looks like</th></tr>
    <tr><td>Limited data</td><td>A hospital cannot pool patient records freely, so it needs a model that learns from fewer cases.</td></tr>
    <tr><td>Computing limits</td><td>A translation app that works offline needs a small model.</td></tr>
    <tr><td>Explainability</td><td>A model nobody can explain is a black box. A bank has to tell a loan applicant why they were denied. A doctor has to justify a diagnosis. Hospitals and banks will not put a system to use if nobody can explain its decisions.</td></tr>
    <tr><td>Existing systems</td><td>A forecast that cannot connect to the ordering system goes unused.</td></tr>
  </table></div>
  <div class="def"><b>Definition</b><p><strong>Explainability.</strong> Whether a person can see why the system decided what it did. A system that cannot show its reasons is called a black box.</p></div>
  <div class="do"><b>Do this</b><ol><li>For each problem below, choose the technology that fits.</li><li>Then decide which of the four limits affected your choice.</li></ol></div>

  <div id="techQuiz"></div>
  <div class="ask"><b>Discuss</b><p>Which of the four limits would cause the most trouble where you work?</p></div>
</template>

<template id="s-fields" data-seg="lecture" data-cap="" data-view="off">
  <p class="kicker">Step 4 · Judge success by the industry</p>
  <h1>Same technology, three builds</h1>
  <p>Three industries use computer vision to sort images. Each industry needed something different.</p>
<div class="def"><b>Definition</b><p><strong>Computer vision.</strong> AI that works with images and video.</p><p><strong>Augmented reality.</strong> A live camera view with digital objects placed in it.</p></div>
  <div class="tw"><table id="fieldTable">
    <tr><th>Industry</th><th>The problem</th><th>Type</th><th>What shaped the build</th></tr>
    <tr class="hl"><td>Healthcare</td><td>Screening diabetic patients for eye disease</td><td>Classification</td><td>Regulation. The FDA cleared IDx-DR in 2018 after a clinical trial.</td></tr>
    <tr class="hl"><td>Manufacturing</td><td>Catching defects on a fast line</td><td>Classification</td><td>Rare examples. Few defect images exist to train on.</td></tr>
    <tr class="hl"><td>Agriculture</td><td>Diagnosing crop disease far from internet service</td><td>Classification</td><td>Computing limits. PlantVillage Nuru runs on the farmer's phone.</td></tr>
    <tr><td>Finance</td><td>Stopping card fraud during the purchase</td><td>Anomaly detection</td><td>Speed. Milliseconds to decide, and every false alarm blocks an honest customer.</td></tr>
    <tr><td>Retail</td><td>Stocking the right amount</td><td>Regression</td><td>Existing systems. The forecast must flow into ordering.</td></tr>
    <tr><td>Military</td><td>Predicting part failures before they ground an aircraft</td><td>Regression and anomaly detection</td><td>Data quality. Handwritten and inconsistent logs weaken the model.</td></tr>
  </table></div>
  <p><strong>Retail has its own build.</strong> Augmented reality puts the sofa in your room or the glasses on your face before you buy. Shoppers see size, fit, and color in place. Fewer surprises at the door means fewer returns.</p>
  <p><strong>Ask two questions about any AI system. What does it do? What did its industry require of it?</strong></p>
  <div class="ask"><b>Discuss</b><p>Pick your own industry. What would it require of an AI system that another industry would not?</p></div>
</template>

<template id="s-language" data-seg="lecture" data-cap="Entailment is a sorting task with three bins: supports, contradicts, cannot tell." data-view="off">
  <p class="kicker">Step 4 · Judge success by the industry</p>
  <h1>Language AI in two industries</h1>
  <div class="def"><b>Definition</b><p><strong>Natural language processing (NLP).</strong> AI that works with human language.</p><p><strong>Textual entailment.</strong> Deciding whether one statement logically supports another.</p></div>
  <div class="do"><b>Do this</b><ol><li>Read each pair of statements.</li><li>Select supports, contradicts, or cannot tell.</li><li>Read the explanation.</li></ol></div>

  <div id="entQuiz"></div>
  <div class="duo" style="margin-top:14px">
    <div class="panel"><p><strong>Legal.</strong> Precision comes first. One missed clause costs money. JPMorgan's COIN software, short for Contract Intelligence, reads commercial-loan agreements in seconds. The same review took lawyers and loan officers about 360,000 hours a year.</p></div>
    <div class="panel"><p><strong>Customer service.</strong> Speed and a natural conversation come first. A slightly wrong answer gets corrected in the next message. A slow one loses the customer.</p></div>
  </div>
  <p><strong>Same technology. The industry changed the priority from speed to precision.</strong></p>
  <div class="ask"><b>Discuss</b><p>In your work, when is "cannot tell" the right answer? What happens if the system guesses instead?</p></div>
</template>

<template id="s-success" data-seg="lecture" data-cap="Six patterns hold a project together. Click one on the ring." data-view="off">
  <p class="kicker">Step 4 · What success means</p>
  <h1>Two systems, two meanings of success</h1>
  <div class="duo">
    <div class="panel"><p><strong>Stroke detection software</strong> reads CT scans and alerts the stroke team. It is a triage tool. It moves the likely stroke to the front of the line. It does not diagnose. A doctor makes the final call.</p></div>
    <div class="panel"><p><strong>A fashion recommender</strong> aims for clicks and sales. A bad suggestion costs almost nothing. The team tests new versions on real customers every week.</p></div>
  </div>
  <div class="def"><b>Definition</b><p><strong>Triage.</strong> Sorting patients by urgency so the worst is seen first. A triage tool sets the order. It does not make the diagnosis.</p></div>
  <p>These two systems care about different things. The stroke software has to be accurate, because a mistake can cost a life. The fashion tool has to be quick and cheap to change, because a mistake costs almost nothing.</p>
  <p><strong>Both projects still did the same six things well.</strong> Successful AI projects in every industry do. The Guide calls them the six patterns.</p>
  <div class="row" id="patChips"></div>
  <div class="panel" id="patPanel" aria-live="polite"></div>
  <div class="ask"><b>Discuss</b><p>Pick an AI system you use. What does success mean for it, and who decides?</p></div>
</template>

var EX=[
 {n:'Opening',r:-1,t:'<p>Bayside Family Dental loses about one appointment in six to no-shows. This paper asks one question: should the clinic use AI to predict which patients will miss their appointments? I look at the problem, the risk, the tool, the data, the human check, and one real case. My answer is go, with two conditions.</p>'},
 {n:'The Problem',r:0,t:'<p>My field is dental care. Bayside Family Dental is a four-chair clinic modeled on an office where I worked the front desk for two years. Its problem is no-shows. About one in six patients misses an appointment without calling, and each empty chair costs the clinic roughly an hour of paid staff time. The AI application that fits is prediction, and the problem type is classification: a model uses past appointment records to sort each upcoming appointment into likely to show or likely to miss. Staff would call the likely misses first. A chatbot or image tool does not fit, because the problem is knowing who will not show up, not answering questions or reading X-rays.</p>'},
 {n:'The Risk',r:1,t:'<p>The people affected are the patients. The mistake that matters is a wrong flag. The model marks a reliable patient as a likely no-show, the clinic double-books the slot, and both patients arrive. One of them waits. If the model flags some groups more often, such as patients who ride the bus or work hourly shifts, the same people wait again and again. That is an unfair result even if nobody intended it. The legal issue is privacy. Appointment records are protected health information under HIPAA, so the clinic needs a signed agreement with any vendor that handles them.</p>'},
 {n:'The Tool',r:2,t:'<p>Bayside Family Dental would use an automated machine learning service from a cloud vendor. The office manager uploads two years of appointment records, and the service builds a model that scores each upcoming appointment for no-show risk. This fits the clinic for three reasons. The clinic has no programmer, and this approach needs none. It charges by use, so the cost stays small for a four-chair office. It works with the spreadsheet export the scheduling software already produces. I rejected hiring a developer to build a custom model. It would cost more than the no-shows do, and nobody on staff could maintain it.</p>'},
 {n:'The Data',r:3,t:'<p>The clinic needs two years of appointment records: the date, the time, the day of the week, how far ahead the visit was booked, the type of visit, whether the patient confirmed a reminder, and whether the patient showed up. Three things are wrong with it. The scheduling software uses one code for cancellations and no-shows, so the answer the model learns from is muddy. The clinic changed software 14 months ago, and the older records use different field names. New patients have no history at all. Before any training, the office manager separates the two codes, maps the old fields to the new ones, and removes names and birth dates from the export.</p>'},
 {n:'The Check',r:4,t:'<p>No appointment gets double-booked on the model’s word alone. Each morning the front desk sees the flagged appointments with a risk score. A flag triggers a phone call first. Staff double-book only when the score is high and the patient did not confirm. Once a month the office manager compares the flags with what happened: how many flagged patients showed up, and how many no-shows the model missed. If most flagged patients showed up, the clinic raises the cutoff.</p>'},
 {n:'The Real Case',r:5,t:'<p>Samorani and colleagues (2022) studied no-show prediction in outpatient scheduling. They found that scheduling built on predicted no-show risk gave Black patients longer waits than other patients, because the system placed them in overbooked slots more often. The model was accurate. The result was still unfair. The lesson for Bayside is to use flags for reminder calls first, and to track wait times by patient group, not only empty chairs.</p><p class="muted">Samorani, M., Harris, S. L., Blount, L. G., Lu, H., &amp; Santoro, M. A. (2022). Overbooked and overlooked: Machine learning and racial bias in medical appointment scheduling. <em>Manufacturing &amp; Service Operations Management, 24</em>(6), 2825–2842. https://papers.ssrn.com/abstract=3467047</p>'},
 {n:'Recommendation',r:-2,t:'<p><strong>Go, with two conditions.</strong> First, for three months a flag triggers a reminder call and nothing else. Nobody is double-booked until the monthly check shows the flags are right more often than wrong. Second, the clinic tracks wait times by patient group from the first day. The cost is small and the staff can run it. A wrong flag that causes only a phone call hurts nobody.</p>'},
 {n:'What I Changed',r:-2,t:'<p>After Turn-In 1 feedback, I gave the problem a size: one appointment in six. After Turn-In 2 feedback, I named the option I rejected and why. Writing The Real Case changed my recommendation. My first draft double-booked from the first day. The final version puts double-booking behind a three-month trial.</p>'}];
